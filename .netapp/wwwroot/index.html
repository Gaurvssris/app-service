<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello App Service</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; background:#0f172a; color:#e2e8f0;
           display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
    .card { background:#1e293b; padding:32px 40px; border-radius:16px; max-width:520px; width:90%;
            box-shadow:0 10px 30px rgba(0,0,0,.4); }
    h1 { margin-top:0; }
    .row { display:flex; justify-content:space-between; gap:16px; padding:8px 0; border-bottom:1px solid #334155; }
    .row span:first-child { color:#94a3b8; white-space:nowrap; }
    .row span:last-child { text-align:right; word-break:break-word; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="msg">Loading...</h1>
    <div id="details"></div>
  </div>

  <script>
    fetch('/api/info')
      .then(r => r.json())
      .then(d => {
        document.getElementById('msg').textContent = d.message;
        const rows = {
          'App Service': d.appServiceName,
          'Machine': d.machineName,
          'OS': d.os,
          '.NET': d.dotnetVersion,
          'Server time (UTC)': d.serverTimeUtc
        };
        document.getElementById('details').innerHTML = Object.entries(rows)
          .map(([k, v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`).join('');
      })
      .catch(() => document.getElementById('msg').textContent = 'API error ❌');
  </script>
</body>
</html>
